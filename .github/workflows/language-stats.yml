name: Update language stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch real per-language byte counts and write index/data/language-stats.json
        env:
          GITHUB_USER: encrize
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-language-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- index/data/language-stats.json; then
            echo "No changes, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index/data/language-stats.json
          git commit -m "chore: update language stats"
          git push
